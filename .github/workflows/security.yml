name: Security CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.lock
      - name: Run tests
        run: python -m unittest discover -s tests -v

  sast:
    name: Bandit SAST
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install dependencies
        run: python -m pip install bandit
      - name: Scan application code
        run: bandit -r app.py models.py -f json -o bandit-report.json
      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  sca:
    name: pip-audit SCA
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install dependencies
        run: python -m pip install pip-audit
      - name: Audit Python dependencies
        run: pip-audit -r requirements.lock --no-deps --disable-pip -s osv --format json --output dependency-report.json
      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: dependency-report.json
